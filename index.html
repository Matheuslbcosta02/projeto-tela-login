<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="shortcut icon" href="imgs/login.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediasqueries.css">
   
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
</head>
<body>
    <main>
        <section id="login">

            <div id="imagem">


            </div>

            <div id="formulario">
                <h1>Login</h1>

                <p>Seja bem-vindo(a)! Faça o login para acessar sua conta.</p>

                <form action="login.php" method="post" autocomplete="on">

                        <div class="teste">
                            <div class="email">
                                <label for="ilogin">Email:</label>
                                <input type="email" name="login" id="ilogin" placeholder="Insira o email" autocomplete="email" required max="30">
                                <span class="material-symbols-outlined">person_check</span>
                            </div>
                            <div class="senha">
                                <label for="isenha">Senha:</label>
                                <input type="password" name="senha" id="isenha" placeholder="Insira a senha" min="8" max="30" autocomplete="current-password" required>
                                <span class="material-symbols-outlined">lock</span>
                            </div>
                        </div>
                        <div class="botoes">
                            <input type="submit" value="ENTRAR">
                            <a href="esqueci.html">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                        </div>


                </form>

            </div>

        </section>
    </main>

    <footer>Feito por <em>Matheus Costa</em></footer>
</body>
</html>
